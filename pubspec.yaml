name: finora
description: "Finora is a personal expense tracker: record expenses, plan budgets and category limits, and see where your money goes."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  image_picker: ^1.2.3
  path: ^1.9.1
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2+1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.4.0+3

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
